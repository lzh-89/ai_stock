<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>早盘主线雷达</title>
    <link rel="stylesheet" href="./src/ai-full-market-selection.css?v=20260809-fixed-module-nav2" />
    <link rel="stylesheet" href="./src/morning-sector-radar.css?v=20260718-outcome-backfill" />
  </head>
  <body>
    <main class="shell">
      <header class="page-top">
        <a class="back-link" href="./index.html" title="返回交易工作台" aria-label="返回交易工作台">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11v2H7.8l5.6 5.6L12 20 4 12l8-8 1.4 1.4L7.8 11H20Z"/></svg>
        </a>
        <div class="title-block">
          <span>早盘主线雷达</span>
          <h1>行业/概念活跃度审查</h1>
          <p>先用透明规则计算板块活跃度，再由 DeepSeek 受限审查；只输出观察线索，不给自动买入结论。</p>
        </div>
        <div class="controls">
          <label>
            <span>板块范围</span>
            <select id="sectorTypeSelect">
              <option value="all">行业 + 概念</option>
              <option value="industry">行业板块</option>
              <option value="concept">概念板块</option>
            </select>
          </label>
          <label>
            <span>板块源</span>
            <select id="sourceSelect">
              <option value="auto">自动</option>
              <option value="akshare">AKShare/东财</option>
              <option value="mock">Mock</option>
            </select>
          </label>
          <label>
            <span>市场源</span>
            <select id="marketSourceSelect">
              <option value="auto">自动</option>
              <option value="sina">新浪</option>
              <option value="tencent">腾讯</option>
              <option value="akshare">AKShare</option>
            </select>
          </label>
          <label>
            <span>扫描时点</span>
            <input id="scanTimeInput" type="time" value="10:00" />
          </label>
          <button id="latestButton" class="secondary-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C7.6 3 4 4.3 4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6c0-1.7-3.6-3-8-3Zm0 2c3.8 0 6 .9 6 1s-2.2 1-6 1-6-.9-6-1 2.2-1 6-1Zm0 14c-3.8 0-6-.9-6-1v-2.2c1.4.8 3.7 1.2 6 1.2s4.6-.4 6-1.2V18c0 .1-2.2 1-6 1Zm0-4c-3.8 0-6-.9-6-1v-2.2c1.4.8 3.7 1.2 6 1.2s4.6-.4 6-1.2V14c0 .1-2.2 1-6 1Zm0-4c-3.8 0-6-.9-6-1V7.8C7.4 8.6 9.7 9 12 9s4.6-.4 6-1.2V10c0 .1-2.2 1-6 1Z"/></svg>
            最近结果
          </button>
          <button id="runButton" class="primary-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z"/></svg>
            生成早盘雷达
          </button>
          <label class="force-check">
            <input id="useAiCheck" type="checkbox" checked />
            <span>AI审查</span>
          </label>
          <label class="force-check">
            <input id="forceCheck" type="checkbox" />
            <span>重新跑</span>
          </label>
        </div>
      </header>

      <section id="notice" class="notice" hidden></section>

      <section class="stat-grid">
        <article>
          <span>任务状态</span>
          <strong id="statusText">--</strong>
          <small id="modeText">--</small>
        </article>
        <article>
          <span>板块池</span>
          <strong id="sectorPoolText">--</strong>
          <small id="sourceText">--</small>
        </article>
        <article>
          <span>AI 审查</span>
          <strong id="aiText">--</strong>
          <small id="qualityText">--</small>
        </article>
        <article>
          <span>最终观察</span>
          <strong id="finalText">--</strong>
          <small id="elapsedText">--</small>
        </article>
      </section>

      <section class="progress-panel">
        <div class="progress-bar"><i id="progressBar"></i></div>
        <div id="stageList" class="batch-list"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <span>最终结果</span>
            <h2>AI 审查后的板块观察</h2>
          </div>
          <small id="resultSummary">--</small>
        </div>
        <div id="sectorGrid" class="sector-grid"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <span>规则基线</span>
            <h2>透明规则 Top20</h2>
          </div>
          <small>用于诊断 AI 是否提升、降级或拒绝</small>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>规则排名</th>
                <th>板块</th>
                <th>类型</th>
                <th>活跃度</th>
                <th>涨幅</th>
                <th>上涨扩散</th>
                <th>资金</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="ruleRows"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <span>闭环诊断</span>
            <h2>样本与回填状态</h2>
          </div>
          <button id="refreshOutcomesButton" class="secondary-button" type="button">回填后续表现</button>
        </div>
        <div id="diagnosticsPanel" class="diagnostics-panel"></div>
      </section>
    </main>

    <script src="./src/module-nav.js?v=20260809-fixed-module-nav"></script>
    <script src="./src/morning-sector-radar.js?v=20260718-outcome-backfill"></script>
  </body>
</html>
